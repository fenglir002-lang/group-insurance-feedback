<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>团险小友意见收集箱 · 上下版</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#25282b}main{min-height:100svh;background:#e6e7e9 center/cover no-repeat;display:grid;align-items:center;padding:5vw;gap:3vw}.side{grid-template-columns:1.2fr 1fr}.stack{grid-template-columns:minmax(0,1fr);align-content:center;justify-items:center;gap:5vh}h1{font-size:clamp(28px,3.8vw,64px);letter-spacing:.015em;margin:0}.stack h1{text-align:center}.card{width:100%;background:white;border-radius:16px;padding:clamp(20px,2.7vw,44px);box-shadow:0 8px 32px #2026300b}.stack .card{width:min(72vw,1000px)}textarea{display:block;width:100%;min-height:150px;height:34vh;padding:18px;border:1px solid #b9bdc1;border-radius:8px;font:inherit;font-size:18px;line-height:1.6;resize:vertical;color:inherit}.stack textarea{height:23vh}textarea::placeholder{color:#60656a}textarea:focus-visible,button:focus-visible{outline:3px solid #a32b48;outline-offset:3px}button{display:block;background:#D31145;color:white;border:0;border-radius:8px;font:inherit;font-weight:600;min-height:48px;width:100%;margin:20px auto 0;cursor:pointer}.stack button{width:min(220px,100%)}@media(max-width:620px) and (orientation:portrait){main.side{grid-template-columns:1fr;align-content:center;gap:32px}.stack .card{width:100%}}
textarea:disabled{color:#565a5f;-webkit-text-fill-color:#565a5f;opacity:1;background:#f3f4f5}button:disabled{color:#54585c;background:#dddfe1;cursor:default}

/* The tablet artboard uses logical screen points (CSS pixels). */
html{background:#f5f5f6}
main{width:min(100%,1180px);min-height:0;height:820px;margin:0 auto;box-sizing:border-box;padding:59px;gap:35px}
.stack{gap:41px}
h1{font-size:45px}
.card{padding:32px}
.stack .card{width:min(100%,850px)}
textarea{height:279px}
.stack textarea{height:189px}
@media(max-width:820px){main{padding:5vw;gap:3vw}h1{font-size:clamp(28px,4vw,45px)}}
.stack{background:#fff4f8 center top/100% auto no-repeat;align-content:end;padding-bottom:79px}
.stack h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.stack{position:relative}.preview-tools{max-width:1180px;margin:auto;padding:6px 0;display:flex;justify-content:flex-end}.picker{display:flex;align-items:center;gap:8px;padding:0 10px;background:#fffffff2;border:1px solid #dadce0;border-radius:8px;font-size:14px}.picker select{height:42px;max-width:48vw;color:inherit;background:transparent;border:0;font:inherit}main.stack{overflow:hidden;isolation:isolate}
.art-layer{display:block;position:absolute;height:auto;pointer-events:none;z-index:-1}
.art-layer[hidden]{display:none}
.scene-kv{top:0;left:0;width:100%}
[data-scene="黄蓝纸艺"] .scene-kv{width:95%;top:1.4%;left:.7%}
.scene-title{width:39.62%;left:6.78%;top:13.90%}
[data-scene="四人讨论"] .scene-title{left:2.7%;top:17.1%;transform:rotate(4deg) skewX(9deg)}
[data-scene="双手投递"] .scene-title{width:38.14%;left:5.3%;top:13.1%;transform:skewX(5deg)}
</style><aside class="preview-tools"><label class="picker">背景<select id="bg"><option value="KV-黄蓝纸艺.png" data-scene="黄蓝纸艺">黄蓝纸艺</option><option value="KV-四人讨论-城市轻调.png" data-scene="四人讨论">四人讨论城市轻调</option><option value="KV-双手投递.png" data-scene="双手投递">双手投递</option></select></label></aside><main class="stack"><img class="art-layer scene-kv" alt=""><img class="art-layer scene-title" alt=""><h1>团险小友意见收集箱</h1><section class="card"><form><textarea required aria-label="您对团险小友有哪些改进建议？" placeholder="您对团险小友有哪些改进建议？"></textarea><button>提交意见</button></form></section></main>
<script>
const picker = document.querySelector('#bg');
const artboard = document.querySelector('main');
function applyBackground() {
  const scene = picker.selectedOptions[0].dataset.scene;
  const path = '问卷图层/' + scene;
  artboard.dataset.scene = scene;
  artboard.style.backgroundImage = 'url("' + path + '-背景.png")';
  const kv = artboard.querySelector('.scene-kv');
  kv.hidden = scene === '四人讨论';
  if (kv.hidden) kv.removeAttribute('src');
  else kv.src = path + '-KV.png';
  artboard.querySelector('.scene-title').src = path + '-标题.png';
}
try {
  const saved = localStorage.getItem('feedback.preview.background');
  if (Array.from(picker.options).some(option => option.value === saved)) picker.value = saved;
} catch {}
applyBackground();
picker.addEventListener('change', () => {
  applyBackground();
  try { localStorage.setItem('feedback.preview.background', picker.value); } catch {}
});
const form = document.querySelector('form');
const input = form.querySelector('textarea');
const button = form.querySelector('button');
const prefix = 'group-insurance-feedback.stack.v2.';

function showSubmitted(text) {
  input.value = text;
  input.disabled = true;
  button.textContent = '已提交';
  button.disabled = true;
}

try {
  const latest = Object.keys(localStorage)
    .filter(key => key.startsWith(prefix))
    .map(key => JSON.parse(localStorage.getItem(key)))
    .sort((a, b) => b.created - a.created)[0];
  if (latest) showSubmitted(latest.text);
} catch {
  // The form remains usable if browser storage is unavailable.
}

input.addEventListener('input', () => input.setCustomValidity(''));
form.addEventListener('submit', event => {
  event.preventDefault();
  if (button.disabled) return;
  if (!input.value.trim()) {
    input.setCustomValidity('请填写您的意见');
    input.reportValidity();
    return;
  }
  try {
    localStorage.setItem(prefix + crypto.randomUUID(),
      JSON.stringify({created: Date.now(), text: input.value}));
  } catch {
    alert('保存失败，请重试');
    return;
  }
  showSubmitted(input.value);
  alert('感谢您的反馈');
});
</script></html>
